version: "2"

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - nolintlint
  settings:
    # Import-level bans. They catch every use of a package, which function
    # patterns can miss (method values, struct literals, aliases).
    depguard:
      rules:
        # Only the standard library, aggy itself, and the direct
        # dependencies may be imported, and no network, TLS, plugin, or
        # raw-syscall package: aggy makes no network calls of its own.
        main:
          list-mode: strict
          files: ["$all"]
          allow:
            - $gostd
            - github.com/congdoe/aggy
            - github.com/BurntSushi/toml
            - modernc.org/sqlite
            - golang.org/x/text/unicode/norm
            - golang.org/x/text/cases
            # The pseudo-terminal (internal/execrun) and raw mode
            # (internal/supervisor): the stdlib has neither, and both need
            # ioctls that the syscall and unsafe bans keep out of aggy.
            - github.com/creack/pty
            - golang.org/x/term
            # The only net packages allowed: they parse, and never connect.
            - "net/url$"
            - "net/netip$"
          deny:
            # Every net package by prefix (net, net/http, net/http/cgi,
            # net/rpc, net/smtp, ...) except net/url and net/netip above.
            - pkg: "net$"
              desc: aggy makes no network calls
            - pkg: "net/"
              desc: aggy makes no network calls; only net/url and net/netip are allowed
            - pkg: "log/syslog"
              desc: aggy sends nothing off the machine
            - pkg: "crypto/tls$"
              desc: aggy makes no network calls
            - pkg: "plugin$"
              desc: aggy loads no code at run time
            # unsafe makes //go:linkname possible, which reaches any
            # banned function (os.ReadFile) under another name.
            - pkg: "unsafe$"
              desc: unsafe and //go:linkname reach banned functions around lint
            # cgo calls C file and process functions around every ban.
            - pkg: "C$"
              desc: cgo reaches the disk and processes around internal/safefs
            - pkg: golang.org/x/sys/unix
              desc: use internal/safefs or the stdlib
            # These open files by path, around internal/safefs.
            - pkg: "debug/"
              desc: debug/* opens files by path; use internal/safefs, then parse the bytes
            - pkg: "go/parser$"
              desc: go/parser reads files by path; use internal/safefs, then parse the bytes
            - pkg: "go/build$"
              desc: go/build reads the disk around internal/safefs
        # SQLite opens its files outside safefs, so only the store, which
        # checks the paths itself, may import the driver (and so use its
        # Driver type). Tests may, to build old schemas.
        sqlite:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/store/**"
          deny:
            - pkg: modernc.org/sqlite
              desc: only internal/store uses the SQLite driver
        # Processes start only in the supervisor, the borrow runner, the
        # process runner (internal/execrun), and the test-only fake
        # builder. Tests may start helper processes.
        exec:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/supervisor/**"
            - "!**/internal/borrow/**"
            - "!**/internal/execrun/**"
            - "!**/internal/fakecli/**"
          deny:
            - pkg: "os/exec$"
              desc: processes start only in internal/supervisor, internal/borrow, or internal/execrun
        # The process-starting runner is its own package so that no
        # adapter can reach it. Adapters build commands and run them only
        # through the adapter.Runner their caller passes. An import ban
        # alone in internal/adapter could be dodged by a re-export
        # elsewhere, so only the command layer (internal/cli) and the
        # maintainer capture tool (internal/devfix) may import it; neither
        # can be imported by an adapter (rule adapters below). Tests may.
        # Only the files of those two packages are exempt, not their
        # subpackages: internal/cli/x could otherwise re-export it.
        execrun:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/cli/*.go"
            - "!**/internal/devfix/*.go"
          deny:
            - pkg: github.com/congdoe/aggy/internal/execrun
              desc: only internal/cli and internal/devfix start CLIs; adapters run commands through the Runner their caller passes
        # Adapters never start processes, so they import nothing that
        # does: not the runner, and not the packages allowed to use it.
        adapters:
          files:
            - "**/internal/adapter/**"
            - "!$test"
          deny:
            - pkg: github.com/congdoe/aggy/internal/execrun
              desc: adapters never start processes; the caller passes them a Runner
            - pkg: github.com/congdoe/aggy/internal/cli
              desc: adapters never start processes; internal/cli does
            - pkg: github.com/congdoe/aggy/internal/devfix
              desc: adapters never start processes; internal/devfix does
            - pkg: "os/exec$"
              desc: adapters never start processes
        # The pseudo-terminal and raw-mode modules are allowed in the main
        # list only for the code that runs the on-screen CLI: the process
        # runner, the supervisor, and the end-to-end tests that drive them.
        pty:
          files:
            - "$all"
            - "!**/internal/execrun/**"
            - "!**/internal/supervisor/**"
            - "!**/test/e2e/**"
          deny:
            - pkg: github.com/creack/pty
              desc: only internal/execrun and internal/supervisor use the pseudo-terminal
            - pkg: golang.org/x/term
              desc: only internal/supervisor sets raw mode
        # The fake vendor CLIs are for tests only.
        fakecli:
          files: ["$all", "!$test"]
          deny:
            - pkg: github.com/congdoe/aggy/internal/fakecli
              desc: the fake vendor CLIs are for tests only
    errcheck:
      # A failed write to the terminal has nowhere better to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    nolintlint:
      # A //nolint must name the linter and say why, so a bare one cannot
      # silence the file-system bans below.
      require-explanation: true
      require-specific: true
    forbidigo:
      analyze-types: true
      forbid:
        # All file-system access goes through internal/safefs, which refuses
        # vendor credential files. These are the stdlib entry points that
        # reach the disk by path.
        - pattern: ^os\.(Open|OpenFile|OpenRoot|OpenInRoot|ReadFile|WriteFile|Create|CreateTemp|ReadDir|DirFS|CopyFS|NewFile)$
          msg: use internal/safefs, which refuses vendor credential files
        - pattern: ^os\.(Rename|Link|Symlink|Readlink|Truncate|Remove|RemoveAll|Chmod|Chown|Lchown|Chtimes|Stat|Lstat|Mkdir|MkdirAll|MkdirTemp)$
          msg: use internal/safefs, which refuses vendor credential files
        - pattern: ^ioutil\.
          msg: io/ioutil is banned; use internal/safefs
        - pattern: ^filepath\.(Walk|WalkDir)$
          msg: use internal/safefs, which refuses vendor credential files
        - pattern: ^fs\.(ReadFile|ReadDir|WalkDir)$
          msg: use internal/safefs, or the method on an embed.FS
        # Every syscall package-level name is banned, in safefs too; the
        # constants, types, and calls aggy needs are allowed by name in
        # the exclusions below. Fields and methods of an allowed type
        # (Stat_t.Nlink, SysProcAttr.Setpgid) are not package-level.
        - pattern: ^syscall\.[A-Za-z0-9_]+$
          msg: syscall reaches the disk and processes around internal/safefs; only the allowlisted names may be used
        - pattern: ^filepath\.Glob$
          msg: use internal/safefs, which refuses vendor credential files
        - pattern: ^toml\.(DecodeFile|DecodeFS)$
          msg: read config through internal/safefs (safefs.ReadConfig), then toml.Decode
        # golang.org/x/sys/unix reaches the disk and processes around both
        # safefs and the process rules below.
        - pattern: ^unix\.
          msg: golang.org/x/sys/unix is banned; use internal/safefs or the stdlib
        # SQLite opens its file outside safefs, so only the store, which
        # checks the path and identity itself, may call sql.Open.
        - pattern: ^sql\.(Open|OpenDB)$
          msg: only internal/store opens databases
        # Processes start only in internal/supervisor, internal/borrow, and
        # the process runner (internal/execrun), which runs one CLI path
        # with no stdin and a scrubbed environment. The fake-CLI builder
        # used by tests (internal/fakecli/build.go) runs the go tool.
        - pattern: ^exec\.(Command|CommandContext)$
          msg: processes start only in internal/supervisor, internal/borrow, or internal/execrun
        - pattern: ^os\.StartProcess$
          msg: processes start only in internal/supervisor, internal/borrow, or internal/execrun
        - pattern: ^exec\.Cmd$
          msg: processes start only in internal/supervisor, internal/borrow, or internal/execrun
        # Other stdlib entry points that open files by path.
        - pattern: ^template\.(ParseFiles|ParseGlob)$
          msg: use internal/safefs, then parse the bytes
        - pattern: ^template\.Template\.(ParseFiles|ParseGlob)$
          msg: use internal/safefs, then parse the bytes
        - pattern: ^zip\.OpenReader$
          msg: use internal/safefs, then zip.NewReader
        - pattern: ^(elf|macho)\.Open$
          msg: use internal/safefs, then elf.NewFile or macho.NewFile
        - pattern: ^tls\.LoadX509KeyPair$
          msg: aggy makes no network calls
        # aggy makes no network calls of its own: no telemetry, no model
        # requests, no proxy.
        - pattern: ^net\.Dial
          msg: aggy makes no network calls
        # net is allowed only in the supervisor socket's files, and there
        # only for net.ListenUnix: no other listener, and no name lookups.
        - pattern: ^net\.(Listen|ListenTCP|ListenUDP|ListenPacket|ListenIP|ListenMulticastUDP|ListenUnixgram|FileListener|FileConn|FilePacketConn|Lookup[A-Za-z]*|Resolve[A-Za-z]*)$
          msg: the supervisor socket uses net.ListenUnix only; aggy opens no other socket and resolves no names
        - pattern: ^(net\.)?Dialer\.Dial
          msg: aggy makes no network calls
        # The method forms of a listener and a resolver (B13-11):
        # (&net.ListenConfig{}).Listen, net.DefaultResolver.LookupHost.
        - pattern: ^net\.(ListenConfig|Resolver)\.
          msg: the supervisor socket uses net.ListenUnix only; aggy opens no other socket and resolves no names
        - pattern: ^net\.DefaultResolver$
          msg: aggy resolves no names
        - pattern: ^http\.(Get|Head|Post|PostForm|DefaultClient|DefaultTransport)$
          msg: aggy makes no network calls
        - pattern: ^http\.(Client|Transport)\.(Do|Get|Head|Post|PostForm|RoundTrip)$
          msg: aggy makes no network calls
  exclusions:
    # A "Code generated ... DO NOT EDIT." header must not switch lint off.
    generated: disable
    rules:
      - path: _test\.go$
        linters: [forbidigo]
      # safefs is the file layer, so the os, io/fs, and filepath bans do
      # not apply to it. The syscall ban does: safefs gets only the
      # allowlist below, like everyone else.
      - path: ^internal/safefs/
        text: "use of `(os|fs|filepath|ioutil)\\."
        linters: [forbidigo]
      # The syscall allowlist everywhere: errno values, the open flags
      # safefs needs, the stat type, and flock for the store's locks.
      - text: "use of `syscall\\.(E[A-Z0-9]+|O_NOFOLLOW|O_NONBLOCK|Stat_t|Flock|LOCK_(EX|NB|SH|UN))`"
        linters: [forbidigo]
      # statfs(2) only in safefs, behind its path check (IsAPFS), for the
      # file system's type.
      - path: ^internal/safefs/fstype_darwin\.go$
        text: "use of `syscall\\.(Statfs|Statfs_t)`"
        linters: [forbidigo]
      # access(2) only in safefs, behind its path check (DirWritable).
      - path: ^internal/safefs/
        text: "use of `syscall\\.Access`"
        linters: [forbidigo]
      # Signals and process attributes only where processes are run or
      # checked: the process runner, and the store's leases.
      - path: ^internal/(execrun|store)/
        text: "use of `syscall\\.(Kill|SIG[A-Z0-9]+|Signal|SysProcAttr|WaitStatus)`"
        linters: [forbidigo]
      # The supervisor forwards signals to the CLI, stops itself on a
      # suspend, and handles SIGWINCH.
      - path: ^internal/supervisor/
        text: "use of `syscall\\.(Kill|SIG[A-Z0-9]+|Signal)`"
        linters: [forbidigo]
      # The pseudo-terminal runner reaps its CLI itself, to see a stop.
      - path: ^internal/execrun/pty_unix\.go$
        text: "use of `syscall\\.(Wait4|WUNTRACED)`"
        linters: [forbidigo]
      # Field keys in a syscall.SysProcAttr literal are reported by their
      # bare name.
      - path: ^internal/(execrun|store)/
        text: "use of `(Setpgid|Setsid|Pgid|Pdeathsig|Noctty)`"
        linters: [forbidigo]
      # The supervisor socket, ~/.aggy/run/<parent-id>.sock, needs net: a
      # Unix socket in a 0700 dir that only listens (net.Dial stays
      # banned) and answers only its own uid. Only these files may import
      # net, and the hook client (client_unix.go), which dials it. Tests
      # dial it.
      - path: ^(internal/supervisor/(socket(_test)?|client_unix(_test)?|peercred_(darwin|linux|other))|test/e2e/supervisor_test)\.go$
        text: "import 'net' is not allowed"
        linters: [depguard]
      # aggy hook reaches the supervisor socket with net.DialUnix, after
      # checking the path is aggy's own socket in its 0700 run directory.
      # No other dial, anywhere.
      - path: ^internal/supervisor/client_unix\.go$
        text: "use of `net\\.DialUnix`"
        linters: [forbidigo]
      # The socket's peer checks: the stdlib has no getpeereid
      # (LOCAL_PEERCRED) or LOCAL_PEERPID on darwin, so golang.org/x/sys/unix,
      # for exactly these calls in these two files: the peer's uid and pid,
      # and, on darwin, a process's parent (sysctl kern.proc.pid) for the
      # lineage check. Linux reads parents from /proc through safefs.
      - path: ^internal/supervisor/peercred_(darwin|linux)\.go$
        text: "import 'golang.org/x/sys/unix' is not allowed"
        linters: [depguard]
      - path: ^internal/supervisor/peercred_(darwin|linux)\.go$
        text: "use of `(unix\\.(GetsockoptXucred|GetsockoptUcred|SOL_LOCAL|LOCAL_PEERCRED|SOL_SOCKET|SO_PEERCRED)|[xu]\\.(Uid|Pid))`"
        linters: [forbidigo]
      - path: ^internal/supervisor/peercred_darwin\.go$
        text: "use of `(unix\\.(GetsockoptInt|LOCAL_PEERPID|SysctlKinfoProc)|k\\.(Proc|Eproc)(\\.(P_pid|Ppid))?|P_pid|Ppid)`"
        linters: [forbidigo]
      - path: ^internal/store/
        text: "`sql\\.(Open|OpenDB)`"
        linters: [forbidigo]
      - path: ^internal/(supervisor|borrow)/
        text: "`(exec\\.(Command|CommandContext)|os\\.StartProcess)`"
        linters: [forbidigo]
      - path: ^internal/execrun/(execrun|pty_unix|direct_unix)\.go$
        text: "`exec\\.(Command|CommandContext)`"
        linters: [forbidigo]
      - path: ^internal/execrun/(execrun(_unix|_other)?|pty_unix|direct_unix)\.go$
        text: "`exec\\.Cmd`"
        linters: [forbidigo]
      - path: ^internal/fakecli/build\.go$
        text: "`exec\\.Command`"
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
