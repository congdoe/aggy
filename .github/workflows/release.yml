name: release

# Runs when the owner pushes a v* tag. It makes a draft GitHub release
# and pushes the cask to congdoe/homebrew-aggy; nothing is public until
# the owner publishes the draft. The full checklist is in docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless Sigstore signing through GitHub OIDC
      attestations: write # store the build provenance attestations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Every built-in tool must be pinned to a version in a release.
      - run: make release-pinned
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask to congdoe/homebrew-aggy. The owner
          # creates the tap repo and this secret (docs/release.md).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # Signed checksums and build provenance: a Sigstore-signed SLSA
      # provenance attestation for every archive and for checksums.txt.
      # Verify with: gh attestation verify <file> --repo congdoe/aggy
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
