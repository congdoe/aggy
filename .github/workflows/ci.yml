name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by full commit SHA; the version is in the trailing
# comment.
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # test/e2e runs only in the e2e job below, on its own.
      - run: go test -race $(go list ./... | grep -v '/test/e2e$')
      - run: go build ./...

  # The supervisor in a pseudo-terminal against the fakes, one package at
  # a time, so the pty sessions never compete with other packages' tests.
  e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race -p 1 -count=1 ./test/e2e

  lint:
    # Lint each target OS: files with a darwin, linux, unix, or !unix build
    # tag are only type-checked, and so only linted, for that GOOS,
    # and each architecture, since files can carry an arch build tag.
    # Keep the targets in step with the lint target in the Makefile.
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Lint cannot see a cgo file when it cross-compiles, or assembly at
      # all; both are banned.
      - run: make nocgo noasm
      # Keep the version in step with GOLANGCI_LINT_VERSION in the Makefile.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # A snapshot build of every release target, so a broken release config
  # or cross-compile fails the pull request. Nothing is signed or
  # published.
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # goreleaser reads tags for the version
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Keep the goreleaser version in step with release.yml.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean
