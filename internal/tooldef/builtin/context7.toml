# Context7: current docs for the library version in the repo. The docs
# query leaves the machine (anonymously without an API key); source code
# stays local.
# Source: docs/verification.md, "Managed tools (2026-10-28)":
# @upstash/context7-mcp 4.4.4, context7-mcp (stdio by default).
# Telemetry: aggy sets DO_NOT_TRACK=1 in its processes (T6822). Whether
# this version honours it, or has an opt-out of its own, is unverified
# (TODO(T6822)), so no telemetry_env is set.
name = "context7"
description = "Current library docs for the version in the repo; the docs query leaves the machine"
homepage = "https://github.com/upstash/context7"
version = "4.4.4"
default = false
scope = "global"
network = true # it queries context7's API
unverified = ["homepage"]

[install]
check = ["context7-mcp", "--version"]
check_pattern = '^(\d+\.\d+\.\d+)'
hint = "npm i -g --ignore-scripts @upstash/context7-mcp@4.4.4"

[[mcp]]
vendors = ["claude", "codex", "grok"]
argv = ["context7-mcp"]

[cost]
method = "mcp-schema"
