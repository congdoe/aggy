# CodeGraph: a local code index the agent queries instead of grepping.
# Source: docs/verification.md, "Managed tools (2026-10-28)":
# @colbymchenry/codegraph 1.6.2, codegraph serve --mcp (stdio), which
# takes --path (W71-6): the server runs in aggy's private launch folder,
# so it is told the repo.
# The index (T6711): codegraph init [path] writes .codegraph/ inside the
# repo. aggy runs it once per repo, on the aggy tool on --repo that finds
# no finished index there (internal/cli/toolindex.go), never on its own
# and never for a repo
# where the tool is off. The server keeps the index fresh itself: a file
# watcher, and a catch-up on connect (codegraph 1.6.2 README, "How
# auto-syncing works"). Without a terminal, init gets no stdin and no
# --yes: with no stdin and no terminal, codegraph 1.6.2 init and index
# ask nothing and init writes only .codegraph/ (live, 2026-10-29,
# docs/verification.md).
# Telemetry (README, "Telemetry"; docs/verification.md): codegraph sends
# anonymous usage counts unless CODEGRAPH_TELEMETRY=0 or DO_NOT_TRACK=1.
# aggy sets both in the server, a prebuild, and a rebuild (T6822) unless
# the user config's [tools] allow_telemetry is on; then the person's own
# values pass through (env).
name = "codegraph"
description = "Local code index: the agent asks where a symbol lives instead of grepping"
homepage = "https://github.com/colbymchenry/codegraph"
version = "1.6.2"
default = false
scope = "repo"
lifecycle = ["worktree-copy", "gc", "refresh"]
unverified = ["homepage", "install"]
telemetry_env = ["CODEGRAPH_TELEMETRY=0"]

[install]
check = ["codegraph", "--version"]
check_pattern = '^(\d+\.\d+\.\d+)'
hint = "npm install -g @colbymchenry/codegraph@1.6.2"
prebuild =["codegraph", "init", "{repo}"]
# init exits 0 at once on a repo it counts as initialized, a database an
# interrupted init left included; index [path] rebuilds the full index
# from scratch (the 1.6.2 bundle's lib/dist/bin/codegraph.js, runInit and
# the index command).
rebuild = ["codegraph", "index", "{repo}"]

[[mcp]]
vendors = ["claude", "codex", "grok"]
argv = ["codegraph", "serve", "--mcp", "--path", "{repo}"]
env = ["DO_NOT_TRACK", "CODEGRAPH_TELEMETRY"]

[cost]
method = "mcp-schema"
