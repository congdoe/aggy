# RTK: compresses shell output before the model sees it; failures stay.
# Source: docs/verification.md, "Managed tools (2026-10-28)": rtk 1.1.0,
# rtk hook claude (there is no Grok subcommand).
#
# aggy never runs rtk init: it edits files aggy cannot undo through the
# manifest. RTK is wired as a declared PreToolUse hook instead, which can
# rewrite the command and so is marked as deciding.
# #59 F-6, cleared for Claude: rtk hook claude answers updatedInput with
# a permissionDecisionReason and no permissionDecision, so it never
# approves a command it rewrites (verified live at 1.1.0).
# Not for Codex (S63-9): rtk hook codex answers permissionDecision
# "allow" with every rewrite, which would approve every shell command it
# touches, so aggy does not wire it.
# TODO(T6712): the token cost.
name = "rtk"
description = "Compresses shell command output before the model sees it; failures stay"
homepage = "https://github.com/rtk-ai/rtk"
version = "1.1.0"
default = false
scope = "global"
unverified = ["homepage", "cost"]

[install]
check = ["rtk", "--version"]
check_pattern = 'rtk (\d+\.\d+\.\d+)'

[[hook]]
vendors = ["claude"]
event = "PreToolUse"
matcher = "Bash"
decides = true
argv = ["rtk", "hook", "claude"]

[cost]
method = "none" # TODO(T6712): measure what the hook adds to each CLI
