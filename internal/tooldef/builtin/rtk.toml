# RTK: compresses shell output before the model sees it; failures stay.
# Source: docs/verification.md, "Managed tools (2026-10-28)": rtk 1.1.0,
# rtk hook claude and rtk hook codex (there is no Grok subcommand).
#
# aggy never runs rtk init: it edits files aggy cannot undo through the
# manifest. RTK is wired as declared PreToolUse hooks instead, which can
# rewrite the command and so are marked as deciding.
# #59 F-6, cleared: rtk hook claude answers updatedInput with a
# permissionDecisionReason and no permissionDecision, so it never
# approves a command it rewrites (verified live at 1.1.0).
# TODO(T6712): Codex's matcher for its shell tool, and the token cost.
name = "rtk"
description = "Compresses shell command output before the model sees it; failures stay"
homepage = "https://github.com/rtk-ai/rtk"
version = "1.1.0"
default = false
scope = "global"
unverified = ["homepage", "cost"]

[install]
check = ["rtk", "--version"]
check_pattern = 'rtk (\d+\.\d+\.\d+)'

[[hook]]
vendors = ["claude"]
event = "PreToolUse"
matcher = "Bash"
decides = true
argv = ["rtk", "hook", "claude"]

[[hook]]
vendors = ["codex"]
event = "PreToolUse"
decides = true
argv = ["rtk", "hook", "codex"]

[cost]
method = "none" # TODO(T6712): measure what the hook adds to each CLI
