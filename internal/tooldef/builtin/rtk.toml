# RTK: compresses shell output before the model sees it; failures stay.
# Source: the aggy proposal, section 17. None of its commands is in
# docs/verification.md yet, so every vendor fact below is unverified
# until T6712 checks it at a pinned version.
#
# aggy never runs rtk init: it edits files aggy cannot undo through the
# manifest. RTK is wired as a declared hook instead: a PreToolUse hook
# on Claude's Bash tool, which can rewrite the command and so decides.
# TODO(T6712): confirm RTK's hook command (the argv below is a
# placeholder), and add Codex and Grok, whose shell tool names are not
# verified yet (Grok gets a PostToolUse hook on shell output).
# TODO(T6712): #59 F-6, unverified: if RTK's Claude hook answers
# permissionDecision "allow" together with updatedInput, it would
# approve every Bash command it rewrites. Check its output at the pinned
# version; the wiring must refuse such a hook or strip the allow.
name = "rtk"
description = "Compresses shell command output before the model sees it; failures stay"
homepage = "https://github.com/rtk-ai/rtk"
version = "unpinned" # TODO(T6712): pin the version aggy installs
default = false
scope = "global"
unverified = ["version", "homepage", "install", "hook", "cost"]

[install]
check = ["rtk", "--version"]

[[hook]]
vendors = ["claude"]
event = "PreToolUse"
matcher = "Bash"
decides = true
argv = ["rtk", "hook"]

[cost]
method = "none" # TODO(T6712): measure what the hook adds to each CLI
