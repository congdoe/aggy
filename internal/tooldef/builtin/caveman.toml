# Caveman: a skill for shorter assistant replies. /caveman in Claude and
# Grok, $caveman in Codex. Skill only: never its installers, which edit
# vendor configs, add a proxy, and send telemetry by default.
# Source: docs/verification.md, "Managed tools (2026-10-28)": the skill
# is skills/caveman/SKILL.md at tag v4.0.1 (d262ab3).
# aggy never fetches it: the person copies skills/caveman/ at that tag
# into ~/.aggy/skills/caveman (install.hint, shown when it is missing).
name = "caveman"
description = "A skill for shorter assistant replies, to save output tokens"
homepage = "https://github.com/JuliusBrussee/caveman"
version = "4.0.1"
default = false
scope = "global"
unverified = ["homepage", "install"]

[install]
hint = "never run Caveman's installers; copy skills/caveman/ from tag v4.0.1 (d262ab3) of https://github.com/JuliusBrussee/caveman into ~/.aggy/skills/caveman"

[[skill]]
vendors = ["claude", "codex", "grok"]
path = "~/.aggy/skills/caveman"

[cost]
method = "skill-md"
