# Playwright MCP: the page's accessibility tree instead of a screenshot.
# Project-scoped, only for repos with a UI, and not in the default set.
# Source: docs/verification.md, "Managed tools (2026-10-28)":
# @playwright/mcp 0.0.83, whose binary is playwright-mcp. Its browsers
# are a separate download on first use.
name = "playwright"
description = "Browser automation that reads the accessibility tree instead of a screenshot"
homepage = "https://github.com/microsoft/playwright-mcp"
version = "0.0.83"
default = false
scope = "repo"
when = "has-ui"
unverified = ["homepage"]

[install]
check = ["playwright-mcp", "--version"]
check_pattern = 'Version (\d+\.\d+\.\d+)'

[[mcp]]
vendors = ["claude", "codex", "grok"]
argv = ["playwright-mcp"]

[cost]
method = "mcp-schema"
